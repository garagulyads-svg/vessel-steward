<link rel="icon" href="data:,">

<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="site-header"></div>

<main id="main">

  <section class="wrap" style="padding-block: var(--space-6) var(--space-2); max-width: 40rem;">
    <h1>Our Work</h1>
    <p class="lead">Real work. Real vessels. Done here on O‘ahu.</p>
  </section>

  <section class="wrap section--tight" style="padding-top:0;">
    <div id="work-project-list"></div>
  </section>

  <section class="section section--navy">
    <div class="wrap section-head--center" style="max-width:34rem;margin-inline:auto;">
      <h2>Have something on your boat that needs attention?</h2>
      <p>Send us a few photos and tell us what's going on.</p>
      <div class="cta-row" style="justify-content:center; margin-top: var(--space-3)">
        <a class="btn btn-primary" href="contact.html">Talk to a Vessel Steward</a>

    </div>
  </section>

</main>

<div id="site-footer"></div>
<script src="data/business-info.js"></script>
<script src="data/work-projects.js"></script>
<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script src="js/accordion.js"></script>
<script>
  document.addEventListener("components:ready", function () {
    var host = document.getElementById("work-project-list");
    if (!host || !window.VS_WORK_PROJECTS) return;
    // Renders every project in data/work-projects.js. Add an object
    // there (with before/during/after photos) to add a project here —
    // no edits to this page are needed.
    host.innerHTML = window.VS_WORK_PROJECTS.map(function (p) {
      return (
        '<article class="project-block">' +
        '<div class="project-block__head"><h2 style="margin:0;">' + p.title + '</h2><span class="project-block__cat">Before / During / After</span></div>' +
        '<div class="project-sequence">' +
        '<div class="ph" role="img" aria-label="Placeholder: before — ' + p.title + '"><span class="ph__label">Before</span></div>' +
        '<div class="ph" role="img" aria-label="Placeholder: during — ' + p.title + '"><span class="ph__label">During</span></div>' +
        '<div class="ph" role="img" aria-label="Placeholder: after — ' + p.title + '"><span class="ph__label">After</span></div>' +
        '</div>' +
        '</article>'
      );
    }).join("");
  });
</script>
</body>
</html>
